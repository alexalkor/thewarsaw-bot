name = "warsaw-events-worker"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-08-15"  # matches what was live before v3.1
workers_dev = true
preview_urls = false

# KV namespace id: see `wrangler kv namespace list` or the dashboard
# (Storage & Databases → KV). The binding name (EVENTS_KV) must match
# what worker.js expects — do not rename it without updating worker.js too.
# The id below is the `warsaw_events_kv` namespace (an identifier, not a secret).
kv_namespaces = [
  { binding = "EVENTS_KV", id = "7704bd09b5a247d7ba1062e0197db1a7" }
]

# No [vars] block on purpose: every value this Worker needs (BOT_TOKEN,
# GITHUB_PAT, WEBHOOK_SECRET, ADMIN_USER_ID, CHANNEL_USERNAME) is a secret
# or secret-like and must be set with `wrangler secret put <NAME>` or the
# dashboard's Settings → Variables ("Encrypt" toggle) — never written here,
# because this file is committed to a PUBLIC repo.
